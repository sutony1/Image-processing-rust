[package]
name = "img_view_cv"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
opencv = "0.95"
winapi = { version = "0.3", features = [
    "winuser", "libloaderapi", "wingdi", "windef", "commdlg", 
    "processthreadsapi", "shellscalingapi", "minwindef", "basetsd", "shellapi"
] }
# 新增SAM相关依赖
ort = "1.15.2"
ndarray = "0.15.6"
image = "0.24.7"
# EXIF数据读取
kamadak-exif = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"